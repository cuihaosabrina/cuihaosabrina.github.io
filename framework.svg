<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 578" width="1360" height="1156" role="img" aria-labelledby="fig-title fig-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
<title id="fig-title">From interaction architecture to social mechanisms</title>
<desc id="fig-desc">Two papers approach hybrid intelligence from complementary directions. Left, AI-enhanced collective intelligence (Cui &amp; Yasseri, 2024) represents humans and AI agents as one multiplex network across cognition, physical and information layers. Right, Behavioural sociology of humans and machines (Yasseri, Cui, &amp; Mutzner, 2026) traces social mechanisms across individuals, hybrid groups and organisations. AI social cues link the AI agent to individual-level perception. Both feed into hybrid intelligence, the emergence and conditions of human–AI complementarity.</desc>
